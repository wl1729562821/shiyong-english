name: travel_english
description: "实用英语：基础入门、日常沟通、旅行出行三门课，单词、听说问答、情景对话和自己的标注。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # courses.json 列出几门课；每门课一个目录，每课一个 JSON 文件，改内容不用改代码
  # （asset 目录不会递归，每个子目录都要写）
  assets:
    - assets/courses/
    - assets/courses/basics/
    - assets/courses/daily/
    - assets/courses/travel/
